<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-labelledby="t d">
  <title id="t">Sovereign Dialect-Bridge</title>
  <desc id="d">Animasi alur: warga mengetik aduan dalam bahasa Jawa, pipeline NLP memprosesnya enam tahap, hasilnya muncul di dashboard admin dalam Bahasa Indonesia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2A4A"/><stop offset="1" stop-color="#121a33"/></linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#60A5FA" opacity=".18"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <style>
text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.cover{transform:scaleX(0)}
.flow{animation:dash 1s linear infinite}
.spin{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scene{0.0%{opacity:0}3.75%{opacity:1}95.625%{opacity:1}98.75%{opacity:0}100.0%{opacity:0}}@keyframes cover1{0.0%{transform:scaleX(1)}3.75%{transform:scaleX(1)}11.25%{transform:scaleX(0)}100.0%{transform:scaleX(0)}}@keyframes cover2{0.0%{transform:scaleX(1)}11.25%{transform:scaleX(1)}18.75%{transform:scaleX(0)}100.0%{transform:scaleX(0)}}@keyframes cover3{0.0%{transform:scaleX(1)}18.75%{transform:scaleX(1)}26.25%{transform:scaleX(0)}100.0%{transform:scaleX(0)}}@keyframes badge{0.0%{opacity:0;transform:scale(.8)}27.5%{opacity:0;transform:scale(.8)}29.375%{opacity:1;transform:scale(1)}100.0%{opacity:1;transform:scale(1)}}@keyframes btn{0.0%{transform:scale(1)}31.25%{transform:scale(1)}32.188%{transform:scale(.95)}33.438%{transform:scale(1)}100.0%{transform:scale(1)}}@keyframes pkt1{0.0%{opacity:0;transform:translateX(0px)}33.75%{opacity:0;transform:translateX(0px)}34.375%{opacity:1;transform:translateX(0px)}38.125%{opacity:1;transform:translateX(45px)}38.75%{opacity:0;transform:translateX(45px)}100.0%{opacity:0;transform:translateX(45px)}}@keyframes pkt2{0.0%{opacity:0;transform:translateX(0px)}64.375%{opacity:0;transform:translateX(0px)}65.0%{opacity:1;transform:translateX(0px)}68.75%{opacity:1;transform:translateX(45px)}69.375%{opacity:0;transform:translateX(45px)}100.0%{opacity:0;transform:translateX(45px)}}@keyframes spinner{0.0%{opacity:0}37.5%{opacity:0}38.75%{opacity:1}63.75%{opacity:1}65.0%{opacity:0}100.0%{opacity:0}}@keyframes done{0.0%{opacity:0}64.375%{opacity:0}65.625%{opacity:1}100.0%{opacity:1}}@keyframes tick0{0.0%{opacity:0}40.0%{opacity:0}41.25%{opacity:1}100.0%{opacity:1}}@keyframes dim0{0.0%{opacity:.45}40.0%{opacity:.45}41.25%{opacity:1}100.0%{opacity:1}}@keyframes tick1{0.0%{opacity:0}44.375%{opacity:0}45.625%{opacity:1}100.0%{opacity:1}}@keyframes dim1{0.0%{opacity:.45}44.375%{opacity:.45}45.625%{opacity:1}100.0%{opacity:1}}@keyframes tick2{0.0%{opacity:0}48.75%{opacity:0}50.0%{opacity:1}100.0%{opacity:1}}@keyframes dim2{0.0%{opacity:.45}48.75%{opacity:.45}50.0%{opacity:1}100.0%{opacity:1}}@keyframes tick3{0.0%{opacity:0}53.125%{opacity:0}54.375%{opacity:1}100.0%{opacity:1}}@keyframes dim3{0.0%{opacity:.45}53.125%{opacity:.45}54.375%{opacity:1}100.0%{opacity:1}}@keyframes tick4{0.0%{opacity:0}57.5%{opacity:0}58.75%{opacity:1}100.0%{opacity:1}}@keyframes dim4{0.0%{opacity:.45}57.5%{opacity:.45}58.75%{opacity:1}100.0%{opacity:1}}@keyframes tick5{0.0%{opacity:0}61.875%{opacity:0}63.125%{opacity:1}100.0%{opacity:1}}@keyframes dim5{0.0%{opacity:.45}61.875%{opacity:.45}63.125%{opacity:1}100.0%{opacity:1}}@keyframes skel{0.0%{opacity:1}68.75%{opacity:1}70.625%{opacity:0}100.0%{opacity:0}}@keyframes result{0.0%{opacity:0;transform:translateY(10px)}68.75%{opacity:0;transform:translateY(10px)}71.875%{opacity:1;transform:translateY(0)}100.0%{opacity:1;transform:translateY(0)}}@keyframes baru{0.0%{opacity:1}81.25%{opacity:1}83.125%{opacity:0}100.0%{opacity:0}}@keyframes proses{0.0%{opacity:0}81.25%{opacity:0}83.125%{opacity:1}100.0%{opacity:1}}
.a-scene{animation:scene 16.0s infinite;}.a-cover1{animation:cover1 16.0s infinite;transform-box:fill-box;transform-origin:right center;animation-timing-function:steps(24,end);}.a-cover2{animation:cover2 16.0s infinite;transform-box:fill-box;transform-origin:right center;animation-timing-function:steps(24,end);}.a-cover3{animation:cover3 16.0s infinite;transform-box:fill-box;transform-origin:right center;animation-timing-function:steps(24,end);}.a-badge{animation:badge 16.0s infinite;transform-box:fill-box;transform-origin:center;}.a-btn{animation:btn 16.0s infinite;transform-box:fill-box;transform-origin:center;}.a-pkt1{animation:pkt1 16.0s infinite;}.a-pkt2{animation:pkt2 16.0s infinite;}.a-spinner{animation:spinner 16.0s infinite;}.a-done{animation:done 16.0s infinite;}.a-tick0{animation:tick0 16.0s infinite;}.a-dim0{animation:dim0 16.0s infinite;}.a-tick1{animation:tick1 16.0s infinite;}.a-dim1{animation:dim1 16.0s infinite;}.a-tick2{animation:tick2 16.0s infinite;}.a-dim2{animation:dim2 16.0s infinite;}.a-tick3{animation:tick3 16.0s infinite;}.a-dim3{animation:dim3 16.0s infinite;}.a-tick4{animation:tick4 16.0s infinite;}.a-dim4{animation:dim4 16.0s infinite;}.a-tick5{animation:tick5 16.0s infinite;}.a-dim5{animation:dim5 16.0s infinite;}.a-skel{animation:skel 16.0s infinite;}.a-result{animation:result 16.0s infinite;}.a-baru{animation:baru 16.0s infinite;}.a-proses{animation:proses 16.0s infinite;}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  <rect width="1200" height="590" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="590" rx="20" fill="url(#dots)"/>

  <text x="40" y="72" font-size="44" font-weight="800" fill="#fff">Sovereign <tspan fill="#60A5FA">Dialect-Bridge</tspan></text>
  <text x="40" y="108" font-size="18" fill="#CBD5E1">Warga mengadu dalam bahasa daerah, pemerintah membacanya dalam Bahasa Indonesia.</text>

  <g class="a-scene">
    <!-- 1. Aduan warga -->
    <g transform="translate(40 170)" filter="url(#sh)">
      <rect width="330" height="380" rx="16" fill="#fff"/>
      <path d="M0 16a16 16 0 0 1 16-16h298a16 16 0 0 1 16 16v36H0z" fill="#EFF6FF"/>
      <text x="22" y="32" font-size="16" font-weight="700" fill="#1E2A4A">Aduan warga</text>
      <g class="a-badge"><rect x="212" y="13" width="96" height="26" rx="13" fill="#2563EB"/>
        <text x="260" y="31" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Jawa · 94%</text></g>

      <text x="22" y="84" font-size="12" fill="#64748B">Ceritakan masalahmu</text>
      <rect x="22" y="96" width="286" height="120" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="34" y="130" font-size="14" fill="#1E2A4A">Dalane rusak ing cedhak pasar,</text>
      <text x="34" y="158" font-size="14" fill="#1E2A4A">akeh bolongane lan mbebayani</text>
      <text x="34" y="186" font-size="14" fill="#1E2A4A">yen wengi. Mugi enggal didandani.</text>
      <rect class="cover a-cover1" x="30" y="113" width="270" height="24" fill="#F1F5F9"/>
      <rect class="cover a-cover2" x="30" y="141" width="270" height="24" fill="#F1F5F9"/>
      <rect class="cover a-cover3" x="30" y="169" width="270" height="24" fill="#F1F5F9"/>

      <text x="22" y="244" font-size="12" fill="#64748B">Lokasi</text>
      <rect x="22" y="254" width="286" height="40" rx="10" fill="#F1F5F9"/>
      <path d="M42 266a6 6 0 0 1 6 6c0 4.5-6 10-6 10s-6-5.5-6-10a6 6 0 0 1 6-6z" fill="#2563EB"/>
      <circle cx="42" cy="272" r="2.2" fill="#fff"/>
      <text x="58" y="279" font-size="13" fill="#1E2A4A">Dekat Pasar Induk</text>

      <g class="a-btn"><rect x="22" y="318" width="286" height="44" rx="12" fill="#2563EB"/>
        <text x="165" y="346" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Kirim aduan</text></g>
    </g>

    <!-- konektor 1 -->
    <line class="flow" x1="378" y1="360" x2="432" y2="360" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round" opacity=".6"/>
    <polygon points="431,352 444,360 431,368" fill="#60A5FA"/>
    <circle class="a-pkt1" cx="385" cy="360" r="7" fill="#93C5FD" opacity="0"/>

    <!-- 2. Pipeline NLP -->
    <g transform="translate(445 170)" filter="url(#sh)">
      <rect width="310" height="380" rx="16" fill="#223256" stroke="#3B4F7E" stroke-width="1.5"/>
      <text x="22" y="32" font-size="16" font-weight="700" fill="#fff">Pipeline NLP</text>
      <g transform="translate(278 26)">
        <g class="a-spinner" opacity="0"><circle class="spin" r="9" fill="none" stroke="#60A5FA" stroke-width="3" stroke-dasharray="28 60" stroke-linecap="round"/></g>
        <g class="a-done"><circle r="10" fill="#22C55E"/><path d="M-5 0.5l3.6 3.6L5.5-3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      </g>
      <line x1="22" y1="52" x2="288" y2="52" stroke="#3B4F7E"/>
      
    <g transform="translate(22 76)">
      <circle cx="12" cy="14" r="11" fill="none" stroke="#475A8A" stroke-width="2"/>
      <g class="a-tick0"><circle cx="12" cy="14" r="11" fill="#2563EB"/>
        <path d="M7 14.5l3.6 3.6L17.5 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g class="a-dim0"><text x="36" y="19" font-size="15" font-weight="600" fill="#fff">Deteksi dialek</text>
      <text x="266" y="19" font-size="12" fill="#8FA3CC" text-anchor="end">scikit-learn</text></g>
    </g>
    <g transform="translate(22 125)">
      <circle cx="12" cy="14" r="11" fill="none" stroke="#475A8A" stroke-width="2"/>
      <g class="a-tick1"><circle cx="12" cy="14" r="11" fill="#2563EB"/>
        <path d="M7 14.5l3.6 3.6L17.5 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g class="a-dim1"><text x="36" y="19" font-size="15" font-weight="600" fill="#fff">Terjemah</text>
      <text x="266" y="19" font-size="12" fill="#8FA3CC" text-anchor="end">NLLB-200</text></g>
    </g>
    <g transform="translate(22 174)">
      <circle cx="12" cy="14" r="11" fill="none" stroke="#475A8A" stroke-width="2"/>
      <g class="a-tick2"><circle cx="12" cy="14" r="11" fill="#2563EB"/>
        <path d="M7 14.5l3.6 3.6L17.5 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g class="a-dim2"><text x="36" y="19" font-size="15" font-weight="600" fill="#fff">Ringkas</text>
      <text x="266" y="19" font-size="12" fill="#8FA3CC" text-anchor="end">mT5 / IndoT5</text></g>
    </g>
    <g transform="translate(22 223)">
      <circle cx="12" cy="14" r="11" fill="none" stroke="#475A8A" stroke-width="2"/>
      <g class="a-tick3"><circle cx="12" cy="14" r="11" fill="#2563EB"/>
        <path d="M7 14.5l3.6 3.6L17.5 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g class="a-dim3"><text x="36" y="19" font-size="15" font-weight="600" fill="#fff">Ekstrak entitas</text>
      <text x="266" y="19" font-size="12" fill="#8FA3CC" text-anchor="end">IndoBERT</text></g>
    </g>
    <g transform="translate(22 272)">
      <circle cx="12" cy="14" r="11" fill="none" stroke="#475A8A" stroke-width="2"/>
      <g class="a-tick4"><circle cx="12" cy="14" r="11" fill="#2563EB"/>
        <path d="M7 14.5l3.6 3.6L17.5 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g class="a-dim4"><text x="36" y="19" font-size="15" font-weight="600" fill="#fff">Kategori</text>
      <text x="266" y="19" font-size="12" fill="#8FA3CC" text-anchor="end">klasifikasi</text></g>
    </g>
    <g transform="translate(22 321)">
      <circle cx="12" cy="14" r="11" fill="none" stroke="#475A8A" stroke-width="2"/>
      <g class="a-tick5"><circle cx="12" cy="14" r="11" fill="#2563EB"/>
        <path d="M7 14.5l3.6 3.6L17.5 10" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g class="a-dim5"><text x="36" y="19" font-size="15" font-weight="600" fill="#fff">Skor urgensi</text>
      <text x="266" y="19" font-size="12" fill="#8FA3CC" text-anchor="end">4 level</text></g>
    </g>
    </g>

    <!-- konektor 2 -->
    <line class="flow" x1="763" y1="360" x2="817" y2="360" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round" opacity=".6"/>
    <polygon points="816,352 829,360 816,368" fill="#60A5FA"/>
    <circle class="a-pkt2" cx="770" cy="360" r="7" fill="#93C5FD" opacity="0"/>

    <!-- 3. Dashboard admin -->
    <g transform="translate(830 170)" filter="url(#sh)">
      <rect width="330" height="380" rx="16" fill="#fff"/>
      <path d="M0 16a16 16 0 0 1 16-16h298a16 16 0 0 1 16 16v36H0z" fill="#EFF6FF"/>
      <text x="22" y="32" font-size="16" font-weight="700" fill="#1E2A4A">Dashboard admin</text>

      <g class="a-skel" opacity="0">
        <rect x="22" y="76" width="90" height="24" rx="12" fill="#E2E8F0"/>
        <rect x="22" y="122" width="200" height="16" rx="8" fill="#E2E8F0"/>
        <rect x="22" y="160" width="286" height="12" rx="6" fill="#EEF2F7"/>
        <rect x="22" y="184" width="250" height="12" rx="6" fill="#EEF2F7"/>
        <rect x="22" y="208" width="270" height="12" rx="6" fill="#EEF2F7"/>
      </g>

      <g class="a-result">
        <rect x="22" y="72" width="104" height="26" rx="13" fill="#DBEAFE"/>
        <text x="74" y="90" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Infrastruktur</text>
        <rect x="134" y="72" width="108" height="26" rx="13" fill="#EF9F27"/>
        <text x="188" y="90" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Urgensi tinggi</text>

        <text x="22" y="132" font-size="18" font-weight="700" fill="#1E2A4A">Jalan rusak dekat pasar</text>
        <text x="22" y="166" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">TERJEMAHAN</text>
        <text x="22" y="190" font-size="14" fill="#1E2A4A">Jalan rusak di dekat pasar, banyak</text>
        <text x="22" y="212" font-size="14" fill="#1E2A4A">lubang dan berbahaya pada malam</text>
        <text x="22" y="234" font-size="14" fill="#1E2A4A">hari. Mohon segera diperbaiki.</text>

        <text x="22" y="272" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">LOKASI TERDETEKSI</text>
        <rect x="22" y="282" width="108" height="26" rx="13" fill="#F1F5F9"/>
        <text x="76" y="300" font-size="12" font-weight="600" fill="#1E2A4A" text-anchor="middle">Pasar Induk</text>

        <line x1="22" y1="326" x2="308" y2="326" stroke="#E2E8F0"/>
        <text x="22" y="358" font-size="13" fill="#64748B">Status</text>
        <g class="a-baru"><rect x="214" y="338" width="94" height="28" rx="14" fill="#DBEAFE"/>
          <text x="261" y="357" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">Baru</text></g>
        <g class="a-proses" opacity="1"><rect x="214" y="338" width="94" height="28" rx="14" fill="#DCFCE7"/>
          <text x="261" y="357" font-size="12" font-weight="700" fill="#15803D" text-anchor="middle">Diproses</text></g>
      </g>
    </g>
  </g>
</svg>
