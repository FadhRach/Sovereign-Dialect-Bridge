<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-labelledby="t d">
  <title id="t">Pipeline NLP</title>
  <desc id="d">Enam tahap pemrosesan aduan: deteksi dialek, terjemah, ringkas, ekstrak entitas, kategori, skor urgensi.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle; }
    .ttl { font-size: 16px; font-weight: 700; fill: #1E2A4A; }
    .sub { font-size: 13px; fill: #64748B; }
    .n   { font-size: 18px; font-weight: 800; fill: #fff; }
  </style>

  <rect width="1200" height="210" rx="20" fill="#EFF6FF"/>

  <!-- garis penghubung: x = pusat lingkaran +/- 36 -->
  <g stroke="#93C5FD" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M169 72H274"/><path d="M356 72H461"/><path d="M543 72H648"/>
    <path d="M730 72H835"/><path d="M917 72H1022"/>
  </g>
  <g fill="#93C5FD">
    <path d="M274 64l12 8-12 8z"/><path d="M461 64l12 8-12 8z"/><path d="M648 64l12 8-12 8z"/>
    <path d="M835 64l12 8-12 8z"/><path d="M1022 64l12 8-12 8z"/>
  </g>

  <g fill="#2563EB">
    <circle cx="133" cy="72" r="28"/><circle cx="320" cy="72" r="28"/><circle cx="507" cy="72" r="28"/>
    <circle cx="694" cy="72" r="28"/><circle cx="881" cy="72" r="28"/><circle cx="1068" cy="72" r="28"/>
  </g>
  <text class="n" x="133" y="78">1</text><text class="n" x="320" y="78">2</text><text class="n" x="507" y="78">3</text>
  <text class="n" x="694" y="78">4</text><text class="n" x="881" y="78">5</text><text class="n" x="1068" y="78">6</text>

  <text class="ttl" x="133" y="136">Deteksi dialek</text><text class="sub" x="133" y="160">scikit-learn</text>
  <text class="ttl" x="320" y="136">Terjemah</text><text class="sub" x="320" y="160">NLLB-200</text>
  <text class="ttl" x="507" y="136">Ringkas</text><text class="sub" x="507" y="160">mT5 / IndoT5</text>
  <text class="ttl" x="694" y="136">Ekstrak entitas</text><text class="sub" x="694" y="160">IndoBERT NER</text>
  <text class="ttl" x="881" y="136">Kategori</text><text class="sub" x="881" y="160">klasifikasi topik</text>
  <text class="ttl" x="1068" y="136">Skor urgensi</text><text class="sub" x="1068" y="160">rendah sampai kritis</text>
</svg>
