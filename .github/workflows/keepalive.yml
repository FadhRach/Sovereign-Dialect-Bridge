name: Supabase keepalive

on:
  schedule:
    - cron: "0 3 * * *"   # tiap hari 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Retry panjang karena HF Space free bisa cold start (tidur) saat dipanggil pertama kali.
      - name: Ping backend (insert 1 baris ke Supabase)
        run: |
          curl -fsS -X POST --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 \
            -H "X-Keepalive-Secret: ${{ secrets.KEEPALIVE_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/api/system/keepalive/"
